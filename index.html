<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worklist</title><link rel="stylesheet" href="styles.css"></head>
<body><div class="shell"><aside><div class="logo"><span class="mark">W</span><span>Worklist</span></div><nav><button class="nav active" data-view="active">Active <b id="activeCount">0</b></button><button class="nav" data-view="today">Today</button><button class="nav" data-view="waiting">Waiting / Blocked</button><button class="nav" data-view="completed">Completed</button><button class="nav" data-view="all">All Tasks</button></nav><div class="side-bottom"><div id="storageBadge" class="storage">Storage: This browser</div><button id="exportBtn" class="side-link button-link">Export CSV</button><button id="importBtn" class="side-link button-link">Import CSV</button><input id="importFile" type="file" accept=".csv,text/csv" hidden></div></aside>
<main><header><div><p class="eyebrow">PERSONAL WORK OS</p><h1 id="title">Active Tasks</h1><p id="subtitle">Everything that still needs action.</p></div><button id="addBtn" class="primary">+ Add task</button></header>
<section class="stats"><div><span>Active</span><strong id="sActive">0</strong></div><div><span>Due today</span><strong id="sToday">0</strong></div><div><span>Waiting</span><strong id="sWaiting">0</strong></div><div><span>Completed</span><strong id="sDone">0</strong></div></section>
<section class="capture"><div class="capture-head"><div><h2>Turn notes into tasks</h2><p>Paste meeting notes, messages, or rough thoughts. Review the proposed actions before saving.</p></div></div><textarea id="noteInput" placeholder="Paste your notes here..."></textarea><div class="row"><button id="extractBtn" class="primary">Extract actions</button><button id="clearBtn" class="ghost">Clear</button></div><div id="proposals" class="proposals hidden"></div></section>
<section class="toolbar"><input id="search" placeholder="Search tasks, projects, notes, people…"><select id="project"><option value="">All projects</option></select><select id="priority"><option value="">All priorities</option><option>P0 Urgent</option><option>P1 High</option><option>P2 Normal</option><option>P3 Later</option></select></section>
<section id="list" class="list"></section><div id="empty" class="empty hidden">Nothing here right now.</div></main></div>
<dialog id="dialog"><form id="form"><div class="dialog-head"><div><p class="eyebrow">TASK</p><h2 id="dialogTitle">Add task</h2></div><button type="button" id="close" class="icon">×</button></div><input type="hidden" id="row"><label>Task<input id="task" required></label><div class="two"><label>Status<select id="status"><option>Not Started</option><option>In Progress</option><option>Waiting</option><option>Blocked</option><option>Completed</option><option>Canceled</option></select></label><label>Priority<select id="prio"><option>P0 Urgent</option><option>P1 High</option><option selected>P2 Normal</option><option>P3 Later</option></select></label></div><div class="two"><label>Project<input id="proj"></label><label>Due date<input id="due" type="date"></label></div><label>Waiting on<input id="waiting"></label><label>Notes<textarea id="notes"></textarea></label><div class="dialog-actions"><button type="button" id="cancel" class="ghost">Cancel</button><button class="primary">Save task</button></div></form></dialog>
<div id="toast" class="toast hidden"></div><script src="app.js"></script></body></html>
